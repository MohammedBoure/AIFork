<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThoughtGraph AI - Visual Non-Linear Ideation Canvas</title>
    <meta name="description" content="A visual, non-linear branching thought organizer and ideation canvas powered by Google Gemini API with per-branch model customization and multi-path synthesis." />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('thoughtgraph_ai_theme');
          var theme = saved === 'light' ? 'light' : 'dark';
          document.documentElement.classList.add(theme);
          document.documentElement.classList.remove(theme === 'light' ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="overflow-hidden antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
